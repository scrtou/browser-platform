// Browser Platform managed Firefox preferences.
var managedLocale = getenv("BROWSER_PLATFORM_LOCALE");
var managedLanguages = getenv("BROWSER_PLATFORM_LANGUAGES");
if (managedLocale) {
  lockPref("intl.locale.requested", managedLocale);
}
if (managedLanguages) {
  lockPref("intl.accept_languages", managedLanguages);
}
lockPref("network.proxy.type", 1);
lockPref("network.proxy.socks", "profile-relay");
lockPref("network.proxy.socks_port", 1080);
lockPref("network.proxy.socks_version", 5);
lockPref("network.proxy.socks_remote_dns", true);
lockPref("network.proxy.no_proxies_on", "");
lockPref("network.trr.mode", 5);
lockPref("media.peerconnection.enabled", false);
lockPref("media.peerconnection.ice.proxy_only", true);
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);

lockPref("privacy.resistFingerprinting", false);
lockPref("privacy.fingerprintingProtection", false);
lockPref("privacy.baselineFingerprintingProtection", false);
lockPref("gfx.font_rendering.fallback.async", false);
lockPref("layout.css.devPixelsPerPx", getenv("BROWSER_PLATFORM_DISPLAY_MODE") == "auto" ? "-1.0" : "1.0");
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("browser.startup.homepage_override.mstone", "ignore");
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.tabs.warnOnClose", false);
lockPref("app.update.auto", false);
lockPref("geo.enabled", false);
// This fixed image has no speech dispatcher voices. Keep the native empty
// voice list without an asynchronous infobar changing the page viewport.
lockPref("media.webspeech.synth.dont_notify_on_error", true);
