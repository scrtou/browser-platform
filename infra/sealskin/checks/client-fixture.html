<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>Browser Platform Client QA</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 20px; color: #172b35; background: #f2f6f7; font: 18px/1.5 sans-serif; }
  h1 { font-size: 25px; margin: 0 0 8px; }
  #targets { display: flex; gap: 18px; margin: 20px 0; }
  #targets button { width: 116px; height: 65px; border: 0; border-radius: 8px; color: white; font: bold 18px sans-serif; }
  #targets button:nth-child(1) { background: rgb(220,61,72); }
  #targets button:nth-child(2) { background: rgb(19,142,123); }
  #targets button:nth-child(3) { background: rgb(68,110,220); }
  #targets button:nth-child(4) { background: rgb(139,75,199); }
  #targets button:nth-child(5) { background: rgb(222,142,30); }
  textarea { display: block; width: min(100%, 850px); height: 110px; padding: 10px; font: 20px/1.5 sans-serif; }
  #status { min-height: 30px; }
  #report { height: 180px; font: 13px monospace; }
  #paste-target { width: min(100%, 850px); min-height: 65px; padding: 12px; border: 2px dashed #67818e; background: white; }
  #image-preview { max-width: min(100%, 850px); max-height: 320px; object-fit: contain; }
  #scroll-target { margin-top: 1000px; padding: 25px; background: #dfebee; }
</style>
<h1>客戶端驗收</h1>
<p>本頁只使用測試資料。調整本機視窗後點擊下方按鈕，輸入中文，再檢查導覽與重新連線。</p>
<nav><a id="next" href="?step=two">下一頁</a> · <a id="new-tab" href="?step=tab" target="_blank">新分頁</a> · <span id="step"></span></nav>
<div id="targets"><button id="point-1">一</button><button id="point-2">二</button><button id="point-3">三</button><button id="point-4">四</button><button id="point-5">五</button></div>
<label for="input">文字與輸入法</label>
<textarea id="input" placeholder="請輸入：繁體中文 測試 😀"></textarea>
<p id="status" role="status">等待操作</p>
<button id="export" type="button">複製驗收資料（F9）</button>
<textarea id="report" readonly aria-label="驗收資料"></textarea>
<section aria-label="截圖貼上測試">
  <h2>截圖預覽</h2>
  <div id="paste-target" contenteditable="true" role="textbox" tabindex="0" aria-label="截圖貼上區">點擊此處，再按 ⌘V 貼上測試截圖。</div>
  <p id="image-status" role="status">尚未收到圖片。</p>
  <img id="image-preview" alt="已貼上的測試截圖" hidden>
</section>
<div id="scroll-target">捲動至此處後，按 Home 返回。</div>
<script>
const input = document.querySelector('#input'), report = document.querySelector('#report');
const step = new URL(location.href).searchParams.get('step') || 'one';
document.querySelector('#step').textContent = '目前頁面：' + step;
const observations = {coordinates:[], inputEvents:[], screenshotPastes:[], reportSequence:0};
let previewURL = null, pasteSequence = 0;
document.querySelector('#paste-target').addEventListener('paste', async event => {
  const file = [...(event.clipboardData?.files || [])].find(item => item.type.startsWith('image/'));
  if (!file) return;
  event.preventDefault();
  const sequence = ++pasteSequence, status = document.querySelector('#image-status');
  status.textContent = '正在讀取圖片…';
  if (file.size > 25 * 1024 * 1024) { status.textContent = '圖片超過 25 MiB，請使用較小的測試截圖。'; return; }
  let url = null;
  try {
    url = URL.createObjectURL(file);
    const decoded = new Image(); decoded.src = url; await decoded.decode();
    const sha256 = [...new Uint8Array(await crypto.subtle.digest('SHA-256', await file.arrayBuffer()))]
      .map(value => value.toString(16).padStart(2,'0')).join('');
    const canvas = document.createElement('canvas'); canvas.width = decoded.naturalWidth; canvas.height = decoded.naturalHeight;
    const context = canvas.getContext('2d'); context.drawImage(decoded, 0, 0);
    const pixelSHA256 = [...new Uint8Array(await crypto.subtle.digest('SHA-256', context.getImageData(0,0,canvas.width,canvas.height).data))]
      .map(value => value.toString(16).padStart(2,'0')).join('');
    if (sequence !== pasteSequence) return;
    if (previewURL) URL.revokeObjectURL(previewURL);
    previewURL = url; url = null;
    const preview = document.querySelector('#image-preview'); preview.src = previewURL; preview.hidden = false;
    observations.screenshotPastes.push({trusted:event.isTrusted,type:file.type,bytes:file.size,
      width:decoded.naturalWidth,height:decoded.naturalHeight,sha256,pixelSHA256});
    observations.screenshotPastes = observations.screenshotPastes.slice(-5);
    status.textContent = `圖片已顯示：${decoded.naturalWidth} × ${decoded.naturalHeight}。請確認內容，再複製驗收資料。`;
  } catch (error) {
    if (sequence === pasteSequence) status.textContent = '圖片預覽失敗：' + error.name;
  } finally { if (url) URL.revokeObjectURL(url); }
});
input.value = sessionStorage.getItem('bp-r4-input') || '';
for (const name of ['keydown','keyup','compositionstart','compositionupdate','compositionend','beforeinput','input']) {
  input.addEventListener(name, event => {
    observations.inputEvents.push({type:name, trusted:event.isTrusted, inputType:event.inputType || '', composing:!!event.isComposing,
      key:event.key, code:event.code, data:event.data, altKey:event.altKey, ctrlKey:event.ctrlKey, metaKey:event.metaKey, shiftKey:event.shiftKey});
    observations.inputEvents = observations.inputEvents.slice(-80);
    if (name === 'input') sessionStorage.setItem('bp-r4-input', input.value);
  });
}
for (const target of document.querySelectorAll('#targets button')) target.addEventListener('click', event => {
  observations.coordinates.push({target:target.id, trusted:event.isTrusted, clientX:event.clientX, clientY:event.clientY,
    screenX:event.screenX, screenY:event.screenY, offsetX:event.offsetX, offsetY:event.offsetY});
  observations.coordinates = observations.coordinates.slice(-30);
  document.querySelector('#status').textContent = '已點擊：' + target.textContent;
});
async function database(value) {
  const db = await new Promise((resolve,reject) => {
    const request = indexedDB.open('bp-r4-client',1);
    request.onupgradeneeded = () => request.result.createObjectStore('values');
    request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
  });
  try {
    return await new Promise((resolve,reject) => {
      const transaction = db.transaction('values',value === undefined ? 'readonly':'readwrite');
      const store = transaction.objectStore('values');
      const request = value === undefined ? store.get('nonce') : store.put(value,'nonce');
      transaction.oncomplete = () => resolve(request.result);
      transaction.onerror = () => reject(transaction.error);
    });
  } finally { db.close(); }
}
const ready = (async () => {
  if (!localStorage.getItem('bp-r4-nonce')) {
    const nonce = crypto.randomUUID();
    await database(nonce); localStorage.setItem('bp-r4-nonce',nonce);
    document.cookie = 'bp_r4_nonce=' + nonce + '; Path=/; Secure; SameSite=Strict; Max-Age=86400';
  }
  document.title = 'Browser Platform Client QA Ready';
})();
async function observe() {
  await ready;
  const cookie = document.cookie.split('; ').find(value => value.startsWith('bp_r4_nonce='))?.slice(12);
  return {
    schemaVersion:'browser-platform/client-observation/v1', checkedAt:new Date().toISOString(), step,
    qaNonce:new URL(location.href).searchParams.get('nonce'),
    environment:{language:navigator.language,languages:[...navigator.languages],timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      screen:{width:screen.width,height:screen.height,availWidth:screen.availWidth,availHeight:screen.availHeight},dpr:devicePixelRatio,
      inner:{width:innerWidth,height:innerHeight},outer:{width:outerWidth,height:outerHeight},position:{x:screenX,y:screenY},
      userAgent:navigator.userAgent,platform:navigator.platform,webRTC:typeof RTCPeerConnection},
    storage:{localStorage:localStorage.getItem('bp-r4-nonce'),indexedDB:await database(),cookie:cookie || null},
    input:input.value, inputRect:input.getBoundingClientRect().toJSON(),
    pasteRect:document.querySelector('#paste-target').getBoundingClientRect().toJSON(), scroll:{x:scrollX,y:scrollY}, ...observations,
    targets:[...document.querySelectorAll('#targets button')].map(element => ({id:element.id,...element.getBoundingClientRect().toJSON()}))
  };
}
async function copyReport() {
  const active = document.activeElement;
  const scroll = [scrollX,scrollY];
  const selection = active === input ? [input.selectionStart,input.selectionEnd] : null;
  observations.reportSequence++;
  report.value = 'BP_CLIENT_REPORT:' + JSON.stringify(await observe());
  report.focus(); report.select();
  const copied = document.execCommand('copy');
  document.title = 'Browser Platform Client QA ' + (copied ? 'Report ' + observations.reportSequence : 'Copy failed');
  active?.focus(); if (selection) input.setSelectionRange(...selection); scrollTo(...scroll);
}
document.querySelector('#export').addEventListener('click',copyReport);
window.addEventListener('keydown',event => {
  if (event.key === 'F9') { event.preventDefault(); copyReport().catch(error => { report.value = error.name; }); }
});
</script>
</html>
