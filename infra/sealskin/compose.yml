services:
  sealskin:
    image: browser-platform/sealskin:0.3.2-lifecycle-v2-a8c7be8a22ededd3
    container_name: sealskin
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      HOST_URL: "${SEALSKIN_HOST_URL:-mysession.azhen.de}"
    volumes:
      - ./config:/config
      - ./storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
