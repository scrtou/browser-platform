# Component reference only: use ../deployment/install.py for a complete new installation.
# This historical standalone Compose lacks the required credential/Session tmpfs mounts.
services:
  sealskin:
    image: "${SEALSKIN_CONTROLLER_IMAGE:?use the verified release controller image}"
    container_name: sealskin
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      SEALSKIN_PUID: "${PUID:-1000}"
      SEALSKIN_PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      HOST_URL: "${SEALSKIN_HOST_URL:-mysession.azhen.de}"
    volumes:
      - ./config:/config
      - ./storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
